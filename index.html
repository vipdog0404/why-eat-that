<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>美食選擇幫手 - 今天吃什麼？</title>
    <style>
        /* 基本頁面設定，讓內容居中 */
        body, html {
            height: 100%;
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: linear-gradient(135deg, #fef3e0 0%, #e0f7fa 100%); /* 搭配圖片的柔和背景漸層 */
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* 首頁容器 */
        .container {
            text-align: center;
            padding: 30px;
            max-width: 1200px;
            width: 90%;
        }

        /* 首頁大圖樣式 */
        .hero-image {
            width: 100%; /* 讓圖片寬度佔滿容器 */
            max-width: 900px; /* 限制最大寬度，避免在大螢幕上過大 */
            height: auto; /* 高度自動維持比例 */
            display: block;
            margin: 0 auto 30px auto; /* 圖片置中，並在下方留白 */
            
            /* 選用效果：加入一點圓角和陰影增加立體感 */
            border-radius: 24px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.15);
            transition: transform 0.3s ease;
        }

        /* 滑鼠移過時的微小互動效果 (選用) */
        .hero-image:hover {
            transform: translateY(-5px);
        }

        /* 標題樣式 */
        h1 {
            color: #333;
            font-size: 2.5rem;
            margin-bottom: 1rem;
        }

        p {
            color: #666;
            font-size: 1.2rem;
        }

        /* 響應式調整：手機板字體改小 */
        @media (max-width: 768px) {
            h1 {
                font-size: 1.8rem;
            }
            p {
                font-size: 1rem;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <img src="hero-image.png" alt="美食選擇轉盤 3D 插圖" class="hero-image">
        
        <h1>今天吃什麼？交給轉盤決定！</h1>
        <p>充滿活力的美食決策小幫手，解決你的選擇困難症。</p>
    </div>

</body>
</html>
